## CCcam Clients (F-line format)
F: user pass               ## all profiles, no reshare
F: user2 pass2 2              ## all profiles, 2 reshares
F: user3 pass3 { profiles=5501,5502; name="My Box"; host=192.168.1.50 }
F: user4 pass4 { shares=0:0:0,0500:32830:1 }
F: user5 pass5 { expire=2025-12-31 23:59; enddate=2025-12-31 }
# F-line sub-options:
#   profiles=...  # profile ports
#   shares=...    # share limits
#   name=...      # real name
#   host=...      # allowed hostname/IP
#   enddate=...   # expiration date
#   expire=...    # expiration date (alias)
#   nodeid=...    # expected nodeid
#   version=...   # expected version
#   dcwcheck=YES  # check DCW per user

