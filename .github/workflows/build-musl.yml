name: build-musl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Zig 0.15.2
        run: |
          mkdir -p /opt/zig
          curl -sL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Build (x86_64 musl)
        run: sh build.sh

      - name: Smoke-test (arranque + GUI + parse limpo)
        run: |
          set -e
          mkdir -p /tmp/smoke/run
          cd /tmp/smoke/run
          printf '%s\n' \
            'LOGFILE: /tmp/smoke/run/multics.log' \
            'LOGMAXSIZE: 1024' \
            'HTTP PORT: 5591' \
            'HTTP USER: admin' \
            'HTTP PASS: admin' \
            'HTTP TITLE: "smoke"' \
            'HTTP EDITOR: OFF' \
            'HTTP RESTART: NO' \
            'CCCAM PORT: 16991' \
            'TELNET PORT: 5691' \
            'MGCAMD PORT: 21991' \
            'CAMD35 PORT: 7591' \
            'CS378X PORT: 8691' \
            'CACHE PORT: 0' \
            'FILE CHANNELINFO: "/tmp/smoke/run/CCcam.channelinfo"' \
            'FILE PROVIDERINFO: "/tmp/smoke/run/CCcam.providers"' \
            'FILE IP2COUNTRY: "/tmp/smoke/run/ip2country.csv"' \
            'BLOCKEDIP FILE: "/tmp/smoke/run/blocked_ips.cfg"' \
            'CONSTCW FILE: "/tmp/smoke/run/Softcam.cfg"' \
            > multics.cfg
          touch CCcam.channelinfo CCcam.providers ip2country.csv blocked_ips.cfg Softcam.cfg
          printf '%s\n' \
            '[DEFAULT]' \
            'DEFAULT DCW TIMEOUT: 3000' \
            '' \
            '[Teste]' \
            'PORT: 15991' \
            'CAID: 1814' \
            'PROVIDERS: 000000' \
            'USER: teste senha { expire=2027-01-01 }' \
            > profiles.cfg
          printf '%s\n' \
            '#N: 127.0.0.1 34000 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14' \
            > servidores.cfg
          printf '%s\n' 'F: smoketest senha123' > clientes_cccam.cfg
          printf '\nINCLUDE "/tmp/smoke/run/profiles.cfg"\nINCLUDE "/tmp/smoke/run/servidores.cfg"\nINCLUDE "/tmp/smoke/run/clientes_cccam.cfg"\n' >> multics.cfg
          rm -f /var/tmp/multics.log
          timeout 8 "$GITHUB_WORKSPACE/build/multics.x64" -f -C multics.cfg > /dev/null 2>&1 &
          BINPID=$!
          sleep 5
          curl -s -o /dev/null -c /tmp/ck -b /tmp/ck -d 'user=admin&pass=admin' http://127.0.0.1:5591/login || true
          echo ""
          curl -s -o /dev/null -w "dashboard: %{http_code}\n" -c /tmp/ck -b /tmp/ck http://127.0.0.1:5591/dashboard || true
          if grep -aE 'config\([0-9]+,[0-9]+\):|Skip F line|invalid port value|Error reading' /var/tmp/multics.log; then
            echo "SMOKE-TEST FAIL: erros no parse"
            cat /var/tmp/multics.log
            exit 1
          fi
          grep -aq 'CCcam server.*started' /var/tmp/multics.log || { echo "SMOKE-TEST FAIL: CCcam server nao arrancou"; cat /var/tmp/multics.log; exit 1; }
          grep -aq 'Telnet server started' /var/tmp/multics.log || { echo "SMOKE-TEST FAIL: Telnet nao arrancou"; cat /var/tmp/multics.log; exit 1; }
          ss -ltn | grep -q ':5591' || { echo "SMOKE-TEST FAIL: GUI sem porta"; exit 1; }
          ss -ltn | grep -q ':16991' || { echo "SMOKE-TEST FAIL: CCcam sem porta"; exit 1; }
          ss -ltn | grep -q ':5691' || { echo "SMOKE-TEST FAIL: Telnet sem porta"; exit 1; }
          echo "SMOKE-TEST OK"
          kill $BINPID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: multics-x64
          path: build/multics.x64
