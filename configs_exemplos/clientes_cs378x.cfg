# ============================================================
# clientes_cs378x.cfg - UTILIZADORES CS378X (TCP) que TU crias
# ============================================================
# Protocolo TCP da familia camd35 (pagina "Cs358x/Camd35" na GUI).
# A porta define-se no multics.cfg (CS378X PORT: 8600).
#
# FORMATO:  CS378X USER: USER PASS [ { OPCOES } ]
#
# Exemplo:  CS378X USER: carlos senha-carlos { profiles=15002; name="Box Carlos" }
#
# OPCOES: profiles=..., shares=..., name=..., host=..., expire=..., dcwcheck=YES
# ============================================================

CS378X USER: usercsx passcsx

# Cliente cs378x com limites de share
#CS378X USER: usercsxb passcsxb { shares=0:0:0,0500:32830:1; name="Box TCP"; host=192.168.1.80 }
