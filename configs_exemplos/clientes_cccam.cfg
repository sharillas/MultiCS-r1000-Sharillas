# ============================================================
# clientes_cccam.cfg - F-LINES (CLIENTES CCcam que TU crias)
# ============================================================
# Cada linha F: cria um login de partilha para uma box CCcam
# (Dreambox, VU+, GTMedia com CCcam, etc.).
#
# FORMATO:  F: USER PASS [NUMERO_DE_RESHAFES] [ { OPCOES } ]
#
# Exemplo simples (sem reshare - o cliente so ve, nao pode dar a outros):
#    F: jose minha-password
#
# Exemplo com 2 reshares (o cliente pode dar a 2 boxes dele):
#    F: jose minha-password 2
#
# Exemplo completo (perfil so MEO, IP fixo, expira em 31/12/2026):
#    F: jose minha-password 2 { profiles=15002; name="Box do Jose"; host=89.154.1.2; expire=2026-12-31; dcwcheck=YES }
#
# OPCOES (entre { } separadas por ;):
#    profiles=15002,15003  -> so estes perfis (portas do profiles.cfg)
#    shares=0:0:0,1814:005211:1  -> limites de reshare por sistema
#    name="Nome"           -> nome que aparece na GUI
#    host=IP               -> so aceita ligacao deste IP
#    expire=AAAA-MM-DD     -> data de expiracao
#    dcwcheck=YES          -> validar as CWs que o cliente envia
#
# A BOX DO CLIENTE liga com:  C: TEU_IP 16000 USER PASS
# DEPOIS DE MUDAR: systemctl restart multics (ou Reload na GUI)
# ============================================================

F: casputanheiro papamolesaio