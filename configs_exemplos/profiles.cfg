# ============================================================
# profiles.cfg - PROFILES (perfis de saida para clientes)
# Cada perfil e uma "porta virtual" com regras proprias.
# [DEFAULT] define valores por defeito para todos os perfis.
# Cada seccao [NOME] cria um perfil novo.
# Antes de cada perfil usa-se um cabecalho:
# #################################################################
# ### PERFIL [NOME] - CAID XXXX - SISTEMA - SATELITE
# #################################################################
# ============================================================

[DEFAULT]
###########################################################
# VALORES POR DEFEITO (todos os perfis herdam isto)
###########################################################
# Chave DES do profile (newcamd)
DEFAULT KEY: 01 02 03 04 05 06 07 08 09 10 11 12 13 14
# Tempo maximo para obter um CW (ms)
# Nos perfis NAGRA (CAID 18xx/19xx/1a0x) recomenda-se 2500:
# o cryptoperiodo e ~10s, por isso um NOK mais rapido deixa o cliente
# pedir o proximo ECM mais cedo (fluidez). Nos outros 3000 chega.
DEFAULT DCW TIMEOUT: 3000
# Numero maximo de falhas de descodificacao seguidas antes de desistir
DEFAULT DCW MAXFAILED: 0
# Tentativas de descodificacao por ciclo
DEFAULT DCW RETRY: 3
# Verificar o CW recebido (anti-fake)
DEFAULT DCW CHECK: NO
# Tempo minimo entre CWs (ms) - 0 = sem limite
DEFAULT DCW MINTIME: 0
# Verificar a paridade do CW (CW0/CW1) - para canais com freeze
DEFAULT DCW CYCLE_CHECK: NO
# Tempo de validade de um ECM aceite (ms)
DEFAULT DCW VALIDECMTIME: 0
# Verificar o ECM antes de pedir (checksum)
DEFAULT ECM CHECK: NO
# Verificar o tamanho do ECM
DEFAULT ECM CHECK LENGTH: YES

# Ligacao a servidores (leitura de cards)
DEFAULT SERVER TIMEOUT: 2000       # tempo maximo de resposta do servidor
DEFAULT SERVER MAX: 0              # maximo de servidores usados por pedido (0=ilimitado)
DEFAULT SERVER INTERVAL: 1000      # intervalo entre tentativas
DEFAULT SERVER VALIDECMTIME: 0     # validade do ECM para o servidor
DEFAULT SERVER FIRST: 0            # servidor fixo para primeiro pedido (0=rotativo)
DEFAULT SERVER ECMTIME: 0          # tempo maximo de resposta do servidor
DEFAULT SERVER THRESHOLD: 0        # limite de falhas antes de excluir servidor

# Retries por protocolo
DEFAULT RETRY NEWCAMD: 3
DEFAULT RETRY CCCAM: 3

# CacheEX
DEFAULT CACHEEX VALIDECMTIME: 7000  # validade do ECM no CacheEX (ms)
DEFAULT CACHEEX MAXHOP: 3           # saltos maximos aceites
DEFAULT CACHEEX MAXHOP_LG: 5        # saltos maximos para cards locais
DEFAULT CACHEEX LOCAL_ONLY: NO      # so aceitar hits gerados localmente
DEFAULT CACHEEX CWCHECK: 0          # verificacao de CW do CacheEX
DEFAULT CACHEEX BLOCK_FAKE_CW: NO   # bloquear CWs falsos de peers

# Cache
DEFAULT CACHE TIMEOUT: 2000
DEFAULT CACHE SENDREQ: YES          # enviar pedidos ao cache
DEFAULT CACHE STATIC: NO
DEFAULT CACHE RESENDREQ: NO         # reenviar pedidos ao cache
DEFAULT CACHE SENDREP: YES          # aceitar respostas do cache

# Aceitar pedidos com campos vazios
DEFAULT ACCEPT NULL SID: NO
DEFAULT ACCEPT NULL CAID: YES
DEFAULT ACCEPT NULL PROVIDER: YES

# Protocolos activos neste profile
DEFAULT ENABLE CCCAM: YES
DEFAULT ENABLE NEWCAMD: YES
DEFAULT ENABLE RADEGAST: YES
DEFAULT ENABLE CACHE: YES
DEFAULT ENABLE CAMD35: YES
DEFAULT ENABLE CS378X: YES
DEFAULT ENABLE MGCAMD: YES
DEFAULT ENABLE FREECCCAM: YES
# SKIPCWC (Skip Same CW): ignora CWs exatamente iguais ao anterior do
# mesmo canal (proteccao contra fakes repetidas). O ECM continua a espera
# de um CW valido de outra fonte (sem NOK imediato para o cliente).
# ATIVAR SO NOS PROFILES AFECTADOS - pode causar problemas noutros canais!
DEFAULT ENABLE SKIPCWC: NO
# SIDs onde o SKIPCWC nao se aplica (canais com CWs legitimamente repetidos)
#DEFAULT DCW SKIPCWC_EXCLUDE_SIDS_ACTIVE: NO
#DEFAULT DCW SKIPCWC_EXCLUDE_SIDLIST: 14B7,14B4

## CW Cycle Check (estilo OSCam) - deteccao de cws fakes/replay
## Aprende o ciclo CW0/CW1 de cada canal e descarta CWs fora do ciclo,
## ECMs antigos (replay) e bad CW cycles. DROPBAD drop no cliente, DROPOLD
## drop de ECM antigo, KEEPCYCLETIME mantem o cycletime aprendido (min)
#DEFAULT ENABLE CWC: NO
#DEFAULT CWC SENSITIVE: 3
#DEFAULT CWC DROPOLD: YES
#DEFAULT CWC DROPBAD: YES
#DEFAULT CWC KEEPCYCLETIME: 5

## NAGRA protection (caids 18xx/19xx/1a0x): checksum das 4 quads, provider,
## ciclo com aprendizagem (6 amostras), similaridade, duplicate/conflicting/
## fake half. ONBAD=YES faz drop em bad dcw (NO = so log)
#DEFAULT ENABLE NAGRA: NO
#DEFAULT NAGRA CHK: YES
#DEFAULT NAGRA PROV: NO
#DEFAULT NAGRA CYCLE: YES
#DEFAULT NAGRA ONBAD: YES
#DEFAULT NAGRA SENSITIVE: 4

## Health scoring: ordena os servers por saude (sucesso, latencia,
## estabilidade, erros) e exclui os doentes (DROPOFF)
#DEFAULT ENABLE HEALTH: NO
#DEFAULT HEALTH WEIGHTS: 40 30 10 20
#DEFAULT HEALTH MINECMS: 20
#DEFAULT HEALTH DROPOFF: 0

## Fallback cross-protocol: ordem de preferencia de protocolos
#DEFAULT ENABLE FALLBACK: NO
#DEFAULT FALLBACK ORDER: NEWCAMD CCCAM CS378X CAMD35 RADEGAST
#DEFAULT FALLBACK TIMEOUT: 800

## Timing budget: usa o cryptoperiod estimado para falhar cedo e dar tempo
## ao cliente de pedir o proximo ECM (ADAPTIVETTL = TTL da cache = periodo)
#DEFAULT ENABLE TIMING: NO
#DEFAULT TIMING FRACTION: 60
#DEFAULT TIMING MINPERIOD: 3000
#CACHE ADAPTIVETTL: 1

## Emulador BISS por perfil (default ON). 0 desliga o constcw/BISS no perfil
#DEFAULT ENABLE EMULATOR BISS: YES

## BUILD LITE: filtro de canais activos (CCcam.lite - gerada pela
## ferramenta Update Channel Info). Sem lista carregada passa tudo.
#DEFAULT ENABLE LITE: NO

# CacheEX neste profile
DEFAULT ENABLE CACHEEX: NO


###########################
## EXEMPLO DE PERFIL: SKY DE 098D
###########################
[Sky DE]
PORT: 15000               # porta de saida deste perfil
CAID: 098D                # CAID principal
PROVIDERS: 0              # providers (0 = todos)
DCW HALFNULLED: YES       # aceitar CWs com metade a zeros (NDS)
DCW SWAP: YES             # trocar bytes do CW (DCWSWAP)
#SID DENYLIST: YES        # inverter a lista SID (negar em vez de permitir)
SID LIST: !EF10,EF11,EF74,EF75,EF76,EF14,1581,EF15,EF77,EF79,5273,5274,1519,2E9B,151A,157F,EF78,157C,2774,2EAF,30D4,2777,1392,0002,30D6,307A,1194,1195,1197,1198,119A,126F,126E,183D,EF17,EF16,6FEC,32C9,32CA,32CB,32CC,32CD,32CE,32CF,32D0,32D1,32D2,32D3,32D6,32D4,33A7,4E27,33A5,332D,3337,132F,1330,33AC,33FD,1334,33FB,33FA,33F9,33F8,33F7,33F6,33F5,1331,33FC,3402
# SKIPCWC activo neste perfil (nano e0)
ENABLE SKIPCWC: YES
# Excluir SIDs do SKIPCWC
DCW SKIPCWC_EXCLUDE_SIDS_ACTIVE: YES
DCW SKIPCWC_EXCLUDE_SIDLIST: 14B7,14B4,152D,EF8B,14B5,2E87,2E91,EF8A,2EA5,101D,332E,EF8C,01A2,00E6,00E9,0130,012D,01A1,0132,012F,01A0,00EA,00E8,01A3,012E,00CC,00CF,00CE,00DC,00CD,00CB,0AB4,00C9,01A4,0A28,0A5A,0A8C,0A96,0AA0,00CA,0AAA,00E7,00EB,0196,1194,1195,1196,1197,1198,119A,6FFB
ECM CHECK LENGTH: NO
DCW CYCLE_CHECK: YES
ECM CHECK: NO
DCW CHECK: YES
DCW MINTIME: 0
DCW VALIDECMTIME: 0
DCW TIMEOUT: 2000
# Ordem e tempos de ligacao aos servidores
SERVER FIRST: 3            # tentar primeiro o servidor 3
SERVER INTERVAL: 600       # intervalo entre servidores (ms)
SERVER TIMEOUT: 1000       # timeout por servidor
SERVER VALIDECMTIME: 2500
SERVER THRESHOLD: 0
CACHE SENDREQ: YES
CACHE SENDREP: YES
# E os servidores que alimentam este perfil (formato de leitura):
# SERVER: host porta user pass { protocolo e opcoes }

###########################
## EXEMPLO DE PERFIL SIMPLES (CSAT/TNTSAT)
###########################
[TntSat]
PORT: 15001
CAID: 0500
PROVIDERS: 030B00
# Para CSAT/TNTSAT nano e0 activar SKIPCWC APENAS neste perfil:
ENABLE SKIPCWC: YES
DCW CHECK: YES
ECM CHECK LENGTH: YES

