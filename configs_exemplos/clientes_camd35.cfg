# ============================================================
# clientes_camd35.cfg - UTILIZADORES CAMD35 (UDP) que TU crias
# ============================================================
# Protocolo UDP antigo (radegast-cs) - pagina "Cs358x/Camd35" na GUI.
# A porta define-se no multics.cfg (CAMD35 PORT: 7502).
#
# FORMATO:  CAMD35 USER: USER PASS [ { OPCOES } ]
#
# Exemplo:  CAMD35 USER: ana senha-ana { profiles=15002; name="Box Ana" }
#
# OPCOES: profiles=..., shares=..., name=..., host=..., expire=..., dcwcheck=YES
# ============================================================

CAMD35 USER: userc35 passc35

# Cliente camd35 restrito a um perfil
#CAMD35 USER: userc35b passc35b { profiles=5501 }
