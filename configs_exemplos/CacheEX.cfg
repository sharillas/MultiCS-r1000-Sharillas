# ============================================================
# CacheEX.cfg - CACHEEX (protocolo de troca entre servers)
# ============================================================
# Nesta build, os peers CacheEX definem-se com linhas C: (readers)
# com a opcao cacheex_mode=3, e os clientes CCcam com F-lines
# com cacheex_mode=2.
#
# Readers CacheEX (C: host porta user pass { cacheex_mode=3 }):
C: cachex1.exemplo.com 8600 user1 pass1 { cacheex_mode=3 }
C: cachex2.exemplo.net 8600 user2 pass2 { cacheex_mode=3; cacheex_maxhop=3 }

# Clientes CCcam com CacheEX (F-lines com cacheex_mode=2) definem-se
# no 1-Clients.cfg (incluido depois do CCCAM PORT).

# Notas:
#  - Os peers aparecem na pagina CacheEX da GUI.
#  - O protocolo tambem aceita peers auto-adicionados (CACHE AUTOADD).
#  - cacheex_mode: 3 = reader CacheEX | 2 = cliente CCcam com CacheEX
