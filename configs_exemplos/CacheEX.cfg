# ============================================================
# CacheEX.cfg - PEERS CACHEEX (troca de CWs entre servidores)
# ============================================================
#
# O CacheEX e o protocolo de troca de CWs entre instalacoes
# MultiCS/oscam (mais rapido que o CACHE classico: e "push").
# As opcoes gerais estao no multics.cfg (CACHEEX VALIDECMTIME,
# CACHEEX MAXHOP, ...) e por perfil no profiles.cfg.
#
# Nesta build os peers definem-se como linhas C: (readers)
# com a opcao cacheex_mode=3:
#
#   C: host porta user pass { cacheex_mode=3 }
#
# Opcoes (entre { } separadas por ;):
#   cacheex_mode=3      -> reader CacheEX (obrigatorio)
#   cacheex_maxhop=N    -> saltos maximos aceites deste peer
#   dcwcheck=YES        -> verificar DCW deste peer
#   name="Nome"         -> nome (aparece na pagina CacheEX da GUI)
#
# Clientes CCcam com CacheEX usam F-lines com cacheex_mode=2
# (definem-se no 1-Clients.cfg).
# ============================================================

# Reader CacheEX simples
C: cachex1.exemplo.com 8600 user1 pass1 { cacheex_mode=3 }

# Reader CacheEX com maxhop
#C: cachex2.exemplo.net 8600 user2 pass2 { cacheex_mode=3; cacheex_maxhop=3 }

# Reader CacheEX local (oscam na mesma maquina)
#C: 127.0.0.1 8600 userlocal passlocal { cacheex_mode=3; dcwcheck=YES; name="oscam local" }
