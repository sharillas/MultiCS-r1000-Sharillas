# ============================================================
# users.cfg - UTILIZADORES GLOBAIS
# Utilizadores definidos antes do primeiro profile valem para
# TODOS os profiles (login unico em qualquer porta).
# Formato: USER: user pass [ { opcoes } ]
#   Opcoes: profiles=..., shares=..., name=..., host=..., expire=...
# ============================================================

# Utilizador global (vale para todos os profiles)
USER: global1 passglobal

# Utilizador global com limites (profiles e dcwcheck suportados)
USER: global2 passglobal2 { profiles=5501,5502 }
#################################################################
# EXEMPLOS DE TODAS AS OPCOES (comentados)
#################################################################
# USER: user pass { profiles=5501,5502; shares=0:0:0,0500:32830:1; name="Minha Box"; host=192.168.1.50; expire=2026-12-31 }
#   profiles=5501,5502   -> so estes profiles (portas)
#   shares=0:0:0,0500:32830:1 -> limites de reshare por caid:provid
#   name="Minha Box"     -> nome real (aparece na GUI)
#   host=IP/HOSTNAME     -> so aceita ligacao deste IP/hostname
#   expire=AAAA-MM-DD    -> data de expiracao (valido ate)
#   enddate=AAAA-MM-DD   -> o mesmo que expire
#################################################################
