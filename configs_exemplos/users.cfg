# ============================================================
# users.cfg - UTILIZADORES GLOBAIS (qualquer protocolo)
# ============================================================
#
# Utilizadores definidos ANTES do primeiro perfil valem para
# TODOS os perfis: o mesmo user/pass faz login em qualquer
# porta (newcamd, mgcamd, camd35, cs378x, ...).
#
# Este ficheiro e INCLUIDO no multics.cfg ANTES do profiles.cfg
# (a ordem importa: users globais primeiro, depois os perfis).
#
# Formato: USER: user pass [ { OPCOES } ]
#
# Opcoes (entre { } separadas por ;):
#   profiles=5501,5502       -> so estes profiles (portas)
#   shares=0:0:0,CAID:PROVID:HOPS -> limites de reshare
#   name="Nome"              -> nome real (aparece na GUI)
#   host=IP/HOSTNAME         -> so aceita ligacao deste IP
#   expire=AAAA-MM-DD        -> data de expiracao
#   enddate=AAAA-MM-DD       -> o mesmo que expire
#   dcwcheck=YES             -> verificar DCW deste utilizador
# ============================================================

# Utilizador global simples (todos os perfis, sem reshare)
USER: global1 passglobal

# Utilizador global com perfil restrito
#USER: global2 passglobal2 { profiles=5501,5502 }

# Utilizador global com tudo
#USER: global3 passglobal3 { profiles=5501,5502; shares=0:0:0,0500:32830:1; name="Box Global"; host=192.168.1.50; expire=2026-12-31; dcwcheck=YES }
