# ============================================================
# Softcam.cfg - CHAVES CONSTANTES (EMULATOR BISS/Tandberg)
# ============================================================
#
# Chaves de canais que nao precisam de card (BISS feeds, Tandberg).
# O Emulator da GUI (pagina Softcam) gere este ficheiro:
#   - conversao e carga de SoftCam.Key
#   - Update SoftCam.Key (download remoto de chaves publicas)
#   - Reload Keys (recarregar este ficheiro)
#
# FORMATO: CAID:PROVID:SID:CW_EM_HEX_32
#   CAID 2600 = BISS | CAID 1010 = Tandberg (outros aceites)
#   PROVID/SID - identificadores do canal (hex, 000000 = qualquer)
#   CW - 16 bytes hex (32 chars). Se forem so 8 bytes (16 chars),
#        o emulador duplica-os (chaves BISS "half")
#   Comentarios com # ou ;
#
# Seccao [MANUAL] (opcional):
#   Chaves abaixo de [MANUAL] nunca sao removidas/sobrepostas pelo
#   updater automatico.
#
# ATIVACAO: os perfis usam "ENABLE EMULATOR BISS" (default YES) e o
# global "ENABLE EMULATOR BISS: YES" no multics.cfg liga o emulador.
# ============================================================

# Chave BISS completa (32 hex)
2600:000000:17ED:1A2B3C8199DDBBCCDDEEFF00112233 ; 1+1 International (4.9E)

# Chave BISS com metade repetida (16 hex - o emulador duplica)
#2600:000000:1FFF:00000000000000001A2B3C8199DDBBCC ; Feed 4.8E

# Chave Tandberg (CAID 1010)
#1010:000000:0001:5FDB06AA1364E5005FDB06AA1364E500

# Seccao manual - chaves que o updater NUNCA remove/sobrepoe
#[MANUAL]
#2600:000000:0E5A:9988AABBCCDDEEFF0011223344556677 ; Minha chave manual
