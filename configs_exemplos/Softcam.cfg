# ============================================================
# Softcam.cfg - CHAVES BISS / CONSTCW (emulador)
# ============================================================
# Chaves de canais abertos por chave fixa (BISS, Tandberg, etc.).
# O emulador entrega a CW quando o canal bate certo com uma entrada.
#
# FORMATO:  CAID:PROVID:SID:CW_32_HEX
#
# Exemplos:
#    2600:000000:1FFF:11223344556677889900112233445566
#    2600:1FFF:0001:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
#
# - CAID 2600 = BISS (o mais comum)
# - PROVID pode ser 000000 (vale para qualquer provider)
# - SID = identificador do canal (hex)
# - CW = 16 bytes em hexadecimal (32 caracteres)
#
# Comentarios com # ou ; no inicio da linha.
# Tambem podes usar a GUI (pagina Softcam) para fazer upload de
# um SoftCam.Key - ele e convertido para este formato.
# ============================================================

