# ============================================================
# clientes_mgcamd.cfg - UTILIZADORES MGCAMD que TU crias
# ============================================================
# Clientes do protocolo mgcamd (box com mgcamd/oscam).
# A porta e a DES KEY do servidor definem-se no multics.cfg
# (MGCAMD PORT / MGCAMD KEY) - a KEY tem de ser igual na box.
#
# FORMATO:  MG: USER PASS [ { OPCOES } ]
#
# Exemplo simples:      MG: maria senha-da-maria
# Exemplo completo:     MG: maria senha-da-maria { profiles=15002; name="Box Maria"; host=89.154.1.3; expire=2026-12-31 }
#
# OPCOES: profiles=..., shares=..., name=..., host=..., expire=..., dcwcheck=YES
# (iguais as F-lines do clientes_cccam.cfg)
# ============================================================

MG: usermg1 passmg1

# Cliente restrito a um perfil
#MG: usermg2 passmg2 { profiles=5501 }

# Cliente completo
#MG: usermg3 passmg3 { profiles=5501,5502; name="Box Mgcamd"; host=192.168.1.70; expire=2026-12-31; dcwcheck=YES }
