# ============================================================
# clientes_cache.cfg - UTILIZADORES DE CACHE (CSP) que TU crias
# ============================================================
#
# Clientes que SE LIGAM A TI pelo protocolo CACHE (troca de CWs):
# eles pedem CWs ao teu servidor e vice-versa.
# O teu servidor de cache define-se no multics.cfg (CACHE PORT).
#
# Formato: CACHE USER: user pass [ { OPCOES } ]
#
# NOTA: os peers a quem TU te ligas (readers de cache) ficam no
# servidores.cfg como linhas CACHE: host porta user pass.
#
# Opcoes (entre { } separadas por ;):
#   profiles=5501,5502 -> so estes profiles
#   shares=CAID:PROVID:HOPS,... -> limites de partilha
#   caids=0500,0100    -> so partilhar estes CAIDs
#   autoadd=yes        -> aceitar/registar este cliente em runtime
# ============================================================

# Cliente de cache simples (comentado - preenche):
#CACHE USER: cachecli1 passcli1
