# ============================================================
# clientes_cache.cfg - UTILIZADORES DE CACHE (CSP) que TU crias
# ============================================================
# Clientes que SE LIGAM A TI pelo protocolo CACHE (troca de CWs
# entre servidores). A tua porta de cache define-se no multics.cfg
# (CACHE PORT).
#
# FORMATO:  CACHE USER: USER PASS [ { OPCOES } ]
#
# Exemplo:  CACHE USER: servidoramigo passcache { shares=1814:005211:1 }
#
# NOTA: os servidores a quem TU te ligas (os teus readers de cache)
# ficam no servidores.cfg como linhas CACHE: host porta user pass.
# ============================================================

