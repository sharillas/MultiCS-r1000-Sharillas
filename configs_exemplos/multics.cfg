# ============================================================
# MultiCS r1000 v1.0 - by Sharillas@2026
# FICHEIRO MESTRE (multics.cfg)
# Todas as opcoes com explicacao em portugues.
# Sintaxe:  DIRECTIVA: valor        |  INCLUDE: "ficheiro.cfg"
# ============================================================

######### FICHEIROS AUXILIARES #########
# Ficheiro com nomes de canais (formato: CAID:PROVID:SID:NOME) - usado na GUI
FILE CHANNELINFO: "/var/etc/CCcam.channelinfo"
# Ficheiro com nomes de providers - usado na GUI
FILE PROVIDERINFO: "/var/etc/CCcam.providers"
# Base de dados IP -> pais para mostrar bandeiras na GUI
FILE IP2COUNTRY: "/var/etc/ip2country.csv"
# CSS externo (tema). Se nao existir, usa o CSS embutido no binario
FILE STYLESHEET: "/var/etc/multics.css"
# JavaScript externo. Se nao existir, usa o JS embutido no binario
#FILE JAVASCRIPT: /var/etc/custom.js
# Ficheiro de IPs bloqueados (gerido na pagina Configurations da GUI)
BLOCKEDIP FILE: "/var/etc/blocked_ips.cfg"
# Ficheiro de chaves CONSTCW (BISS/Tandberg). Formato: CAID:PROVID:SID:CW32HEX
CONSTCW FILE: "/var/etc/Softcam.cfg"
# BUILD LITE: lista de canais activos (caid:provid:sid, FFFE=wildcard).
# Gerada pela ferramenta Update Channel Info (pagina Configurations da GUI).
# Com ENABLE LITE nos perfis, ECMs fora da lista sao ignorados.
#LITE FILE: "/var/etc/CCcam.lite"

######### GLOBAL #########
# Nivel de log: 0=silencioso 1=erros 2=avisos 3=info 4=debug
LOGLEVEL: 3
# Paises bloqueados (codigo de 2 letras, separados por virgula)
BLOCK COUNTRY: XX, YY
# Atraso entre ciclos da thread principal (microsegundos)
DELAY THREAD: 100
# Atraso entre tentativas de ligacao a servidores
DELAY CONNECT: 100
# Tempo de espera antes de religar a um servidor que caiu (segundos)
RECONNECT_GRACE: 60
# Idade maxima de um pedido ECM (ms). Acima disto e abandonado
ECM_MAXALIVE: 17000
# Intervalo de keepalive para clientes newcamd (segundos)
NEWCAMD_KEEPALIVE: 80
# Timeout de espera por dados (poll) nas threads gerais (ms)
GENERAL_POLL_TIMEOUT: 3000
# Timeout de envio de dados (ms)
GENERAL_SEND_TIMEOUT: 500
# Atraso entre tentativas apos erro geral (ms)
GENERAL_ERROR_DELAY: 99000
# Atraso de arranque do cache (ms)
DELAY_CACHE_STARTUP: 3000
# Atraso do ciclo principal (ms)
DELAY_MAIN_SLEEP: 5000

######### HTTP (interface web) #########
# Porto da interface web
HTTP PORT: 5500
# Titulo mostrado no browser
HTTP TITLE: "MultiCS r1000 v1.21 by Sharillas@2026"
# Credenciais de acesso a interface web
HTTP USER: admin
HTTP PASS: admin
# Autorefresh por defeito (segundos). 0 = desligado. Maximo: 100
HTTP AUTOREFRESH: 15
# Numero maximo de pontos no grafico DCW
HTTP DCW_CHART_MAX: 10000
# Numero maximo de cards por servidor na GUI
HTTP MAX_CARDS: 3
# Numero maximo de parametros GET aceites por pedido
HTTP MAX_GETPARAMS: 8
# Mostrar/ocultar paginas na GUI (YES/NO)
HTTP SHOW HOME: YES
HTTP SHOW DEBUG: YES
HTTP SHOW BLOCKED: YES
HTTP SHOW GRAPHS: YES
HTTP SHOW CONFIG: YES
HTTP SHOW SERVERS: YES
HTTP SHOW CACHE: YES
HTTP SHOW CACHEEX: YES
HTTP SHOW NEWCAMD: YES
HTTP SHOW MGCAMD: YES
HTTP SHOW CCCAM: YES
HTTP SHOW CS378X: YES
HTTP SHOW CAMD35: YES
HTTP SHOW FREECCCAM: YES
HTTP SHOW PROFILES: YES
HTTP SHOW DEFAULT: YES
HTTP SHOW EDITOR: YES
HTTP SHOW RESTART: YES

######### TELNET (consola) #########
# Porto do servidor telnet (0 = desligado)
TELNET PORT: 5600
# Credenciais de acesso telnet
TELNET USER: admin
TELNET PASS: muda-esta-password

######### CACHE (servidor de partilha de CWs) #########
# Porto UDP/TCP do cache
CACHE PORT: 5599
# Tempo de espera por resposta de um peer (ms)
CACHE TIMEOUT: 300
# Tempo de vida de um CW no cache (ms)
CACHE ALIVETIME: 4500
# Aceitar peers automaticamente (novo/activo)
CACHE AUTOADD: YES, YES
# Desactivar peer automaticamente apos N falhas
CACHE AUTODISABLE: 2
# Numero maximo de peers ligados
CACHE MAXPEERS: 50
# Intervalo entre pings aos peers (ms)
CACHE PING_INTERVAL: 3000
# Tempo maximo sem resposta antes de marcar peer offline (ms)
CACHE PEER_TIMEOUT: 15000
# Intervalo de verificacao de estado dos peers (ms)
CACHE CHECK_INTERVAL: 1000
# Numero maximo de SMS por peer
CACHE SMS_MAX: 10
# Filtrar CWs repetidos de peers maliciosos (ON/OFF)
CACHE FILTER: ON
# Janela de tempo do filtro (segundos)
CACHE FILTER TIME: 1
# Percentagem minima de hits para manter peer
CACHE THRESHOLD: 0
# Reencaminhar hits do cache para outros peers
CACHE FORWARD: NO
# (CACHE SENDREQ/SENDREP/STATIC/RESENDREQ sao por-profile -
#  configurados no profiles.cfg: DEFAULT CACHE SENDREQ: etc.)
# Verificacoes extra de CW: atualizam o ciclo de CWs em espera por
#  em espera - cross-provider (DCWCHECK2) e cross-SID (DCWCHECK3)
CACHE DCWCHECK2: NO
CACHE DCWCHECK3: NO
# Ping maximo aceite de um peer (ms). Acima disto as respostas sao ignoradas
CACHE MAXPING: 100
# Filtrar por CAID (exemplo comentado: so 0500, 0100, 0604)
#CACHE CAID: 0500, 0100, 0604
# Peers de cache (ficheiro separado)
INCLUDE "/var/etc/Cache.cfg"

# Utilizadores globais (ficheiro separado) - DEVEM vir ANTES dos profiles
INCLUDE "/var/etc/users.cfg"

######### PROFILES #########
# Profiles principais (ficheiro separado)
INCLUDE "/var/etc/profiles.cfg"

######### CAMD35 #########
# Porto do servidor camd35
CAMD35 PORT: 7502
# Enviar keepalives
CAMD35 KEEPALIVE: YES
# Verificar CWs recebidos
CAMD35 DCW CHECK: YES
# Timeout de clientes camd35 (segundos)
CAMD35 CLIENT_TIMEOUT: 300

######### CS378X #########
# Porto do servidor cs378x
CS378X PORT: 8600
CS378X KEEPALIVE: YES
CS378X DCW CHECK: YES
# Tempo de validade de um ECM em CacheEX (ms)
CACHEEX VALIDECMTIME: 3000
# Saltos maximos aceites em CacheEX
CACHEEX MAXHOP: 3

######### CacheEX AIO (novidades da mod) #########
# Tempo de retencao de hits no cache (ms). 0 = desactivado
CACHEEX HITCACHE_TIME: 4500
# Espera maxima sem hit (ms)
CACHEEX WAITTIME: 2000
# Espera maxima quando ja ha hit (ms)
CACHEEX HIT_WAITTIME: 300
# Peers CacheEX (ficheiro separado)
INCLUDE "/var/etc/CacheEX.cfg"

# Utilizadores camd35 e cs378x (ficheiro separado)
INCLUDE "/var/etc/Camd35.cfg"

######### CCCAM (clientes C-lines) #########
# Formato das F-lines (definicao de clientes CCcam):
# F: user pass                          -> todos os profiles, sem reshare
# F: user pass 2                        -> todos os profiles, 2 reshares
# F: user pass { opcoes }               -> opcoes entre chavetas
#   Opcoes F-line:
#     profiles=5501,5502   -> so os profiles indicados
#     shares=0:0:0,0500:32830:1  -> limites de share
#     name="Nome"          -> nome real do cliente
#     host=IP              -> IP/hostname permitido
#     enddate=AAAA-MM-DD   -> data de expiracao
#     expire=AAAA-MM-DD    -> o mesmo que enddate
#     nodeid=xxxx          -> nodeid esperado
#     version=2.3.0        -> versao esperada
#     dcwcheck=YES         -> verificar DCW por utilizador

# Porto do servidor CCcam
CCCAM PORT: 16000
# Versao anunciada aos clientes
CCCAM VERSION: 2.3.0
# Modo stealth (ocultar respostas de erro)
CCCAM STEALTHMODE: YES
# Verificar DCW
CCCAM DCW CHECK: YES
# Enviar keepalives
CCCAM KEEPALIVE: YES
# Janela de DCW (ms)
CCCAM DCWTIME: 300
# Restringir a profiles (comentado = todos)
#CCCAM PROFILES: 5501,5502
# F-lines (ficheiro separado)
INCLUDE "/var/etc/1-Clients.cfg"

# Exemplos de F-lines (podem viver aqui ou no 1-Clients.cfg)
F: user pass
F: user2 pass2 2
F: user3 pass3 { profiles=5501,5502; name="Minha Box"; host=192.168.1.50 }
F: user4 pass4 { shares=0:0:0,0500:32830:1 }
F: user5 pass5 { expire="2026-12-31 23:59"; enddate=2026-12-31 }

######### CCCAM3 (protocolo CCcam 3 - boxes CCcam3) #########
# Servidor CCcam3: as boxes com CCcam 3.0.1 ligam-se a esta porta com
# as MESMAS F-lines do CCcam. Handshake encriptado RSA+AES-GCM (PBKDF2).
CCCAM3 PORT: 16001
# Reader CCcam3: o MultiCS liga-se a um server CCcam3 remoto:
# C3: cccam3.exemplo.com 16001 user pass

######### MGCAMD #########
# Porto do servidor mgcamd
MGCAMD PORT: 21000
# Chave DES do protocolo mgcamd
MGCAMD KEY: 01 02 03 04 05 06 07 08 09 10 11 12 13 14
MGCAMD KEEPALIVE: YES
MGCAMD DCW CHECK: YES
# Restringir a profiles (comentado = todos)
#MGCAMD PROFILES: 5501,5502
# Tentativas de ligacao (0 = infinitas)
MGCAMD RETRY: 0
# Utilizadores mgcamd (ficheiro separado)
INCLUDE "/var/etc/Mgcamd.cfg"

######### NEWCAMD #########
# Identificador do servidor newcamd
NEWCAMD CLIENTID: 8888
NEWCAMD DCW CHECK: YES
NEWCAMD KEEPALIVE: 80
# Timeout de login de clientes newcamd (ms)
NEWCAMD LOGIN_TIMEOUT: 5000
# N-lines (ficheiro separado)
INCLUDE "/var/etc/Nlines.cfg"

######### CONSTCW (Emulator) #########
# Ficheiro de chaves constantes (BISS/Tandberg) - gerido tambem pela GUI
# Se NAO estiver definido, o emulador usa <pasta do multics.cfg>/Softcam.cfg
CONSTCW FILE: "/var/etc/Softcam.cfg"

######### EMULATOR BISS (global) #########
# Liga o emulador de chaves constantes (default YES). Pode ser ligado/
# desligado por perfil com ENABLE EMULATOR BISS.
ENABLE EMULATOR BISS: YES

######### AVANCADO (opcional) #########
# Ignorar mudancas de ficheiros individuais (nao fazer reload no save
# externo): UPDATE ONCHANGE: NO. Por defeito todos os ficheiros do parse
# sao vigiados (inotify) e a config e recarregada ao gravar.
#UPDATE ONCHANGE: YES
# Editar este ficheiro na GUI (EDITFILE: YES) ou nao (NO)
#EDITFILE: YES
# Canal de teste: mostra o estado de descodificacao detalhado deste canal
# no log (formato CAID:PROVID:SID em hex)
#TESTCHANNEL: 1814:005211:0E5A
# Proteccao extra anti bad-DCW (0=desligado, 1=so log, 2=drop)
#BAD-DCW: 0
