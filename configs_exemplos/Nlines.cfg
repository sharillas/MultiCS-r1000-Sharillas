# Nlines.cfg - N-LINES (clientes newcamd)
# Formato: N: host porta user pass deskey [ { opcoes } ]
#   N: 127.0.0.1 5501 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14
#   Opcoes:
#     name="Nome"     -> nome do cliente (aparece na GUI)
#     host=IP         -> so aceita ligacao deste IP
#     expire=AAAA-MM-DD -> data de expiracao
# ============================================================

