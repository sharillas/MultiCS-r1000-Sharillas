# ============================================================
# Nlines.cfg - N-LINES (clientes/servidores NEWCAMD)
# ============================================================
#
# NESTE FICHEIRO PODEM IR OS DOIS TIPOS DE LINHAS:
#
# 1) CLIENTES newcamd (a quem servimos cards) - ficam numa seccao
#    de profile ou sao globais:
#    N: 127.0.0.1 5501 usern1 passn1 01 02 03 04 05 06 07 08 09 10 11 12 13 14
#
# 2) SERVERS (leitores de cards newcamd) - ficam dentro da seccao
#    [PERFIL] no profiles.cfg com a mesma sintaxe N: .
#
# Sintaxe da N-line:
#   N: IP_OU_HOST PORTA USER PASS DES_KEY_14_BYTES [ { OPCOES } ]
#
# Campos:
#   IP_OU_HOST   - IP ou hostname da maquina (para clientes: IP onde
#                  escuta o perfil; para servers: IP do servidor)
#   PORTA        - porta newcamd (do perfil para clientes, do servidor
#                  remoto para readers)
#   USER / PASS  - credenciais de login
#   DES_KEY      - 14 bytes hex (chave DES do protocolo). TEM DE SER
#                  IGUAL a DEFAULT KEY do perfil / do servidor remoto
#
# Opcoes (entre { } separadas por ;):
#   name="Nome"         -> nome do cliente (aparece na GUI)
#   host=IP             -> so aceita ligacao deste IP/hostname
#   expire=AAAA-MM-DD   -> data de expiracao (cliente)
#   enddate=AAAA-MM-DD  -> o mesmo que expire
#   profiles=5501,5502  -> so estes profiles (portas)
#   shares=0:0:0,CAID:PROVID:HOPS  -> limites de reshare
#   dcwcheck=YES        -> verificar DCW deste cliente
#
# EXEMPLOS:
# ============================================================

# Cliente simples (perfil na porta 5501)
N: 127.0.0.1 5501 usern1 passn1 01 02 03 04 05 06 07 08 09 10 11 12 13 14

# Cliente com nome, IP fixo e expiracao
#N: 127.0.0.1 5501 usern2 passn2 01 02 03 04 05 06 07 08 09 10 11 12 13 14 { name="Box Quarto"; host=192.168.1.66; expire=2026-12-31 }

# Cliente restrito a dois profiles
#N: 127.0.0.1 5501 usern3 passn3 01 02 03 04 05 06 07 08 09 10 11 12 13 14 { profiles=5501,5502 }

# Reader (servidor newcamd remoto) - normalmente fica dentro do
# [PERFIL] no profiles.cfg, mas tambem funciona aqui:
#N: servidor.exemplo.com 34000 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14
