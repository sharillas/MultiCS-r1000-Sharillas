# ============================================================
# 1-Clients.cfg - F-LINES (clientes CCcam / C-lines)
# Formato: F: user pass [reshares] [ { opcoes } ]
#   Opcoes F-line:
#     profiles=5501,5502     -> so estes profiles
#     shares=0:0:0,0500:32830:1  -> limites de reshare por caid
#     name="Nome da Box"     -> nome do cliente (aparece na GUI)
#     host=192.168.1.50      -> so aceita ligacao deste IP/hostname
#     enddate=2026-12-31     -> expira nesta data (AAAA-MM-DD)
#     expire=2026-12-31      -> o mesmo que enddate
#     nodeid=0102030405060708-> nodeid esperado do cliente
#     version=2.3.0          -> versao esperada do cliente
#     dcwcheck=YES           -> verificar DCW deste cliente
# ============================================================

# Cliente simples (todos os profiles, sem reshare)
F: usuario1 password1

# Cliente com 2 reshares
F: usuario2 password2 2

# Cliente restrito a um profile, sem reshare
F: usuario3 password3 { profiles=5501 }

# Cliente com nome, IP fixo e data de expiracao
F: usuario4 password4 { name="Box Sala"; host=192.168.1.50; expire=2026-12-31 }

# Cliente com limites de share detalhados
F: usuario5 password5 3 { shares=0:0:0,0500:32830:1,098D:000000:0; dcwcheck=YES }

# Cliente com versao obrigatoria (anti-clones)
F: usuario6 password6 { version=2.3.0; nodeid=0102030405060708 }

# Cliente CCcam com CacheEX ativo (cacheex_mode=2)
F: usercx1 passcx1 { cacheex_mode=2 }
