# ============================================================
# Camd35.cfg - UTILIZADORES CAMD35 e CS378X
# Formato: CAMD35 USER: user pass [ { opcoes } ]
#          CS378X USER: user pass [ { opcoes } ]
#   Opcoes: profiles=5501,5502  -> so estes profiles
#           shares=0:0:0,...    -> limites de share
#           dcwcheck=YES        -> verificar DCW deste user
# ============================================================

# Cliente camd35 simples
CAMD35 USER: userc35 passc35

# Outro exemplo
CAMD35 USER: userc35b passc35b

# Cliente camd35 restrito a um profile
CAMD35 USER: userc35c passc35c { profiles=5501 }

# Cliente cs378x simples
CS378X USER: usercsx passcsx

# Cliente cs378x com limite de shares
CS378X USER: usercsxb passcsxb { shares=0:0:0,0500:32830:1 }
