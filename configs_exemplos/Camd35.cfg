# ============================================================
# Camd35.cfg - UTILIZADORES CAMD35 (UDP) e CS378X (TCP)
# ============================================================
#
# Os dois protocolos sao da mesma familia e partilham a pagina
# "Cs358x/Camd35" na GUI.
#
# CAMD35 - protocolo UDP antigo (radegast-cs):
#   CAMD35 USER: user pass [ { OPCOES } ]
#   O servidor (porta) define-se no multics.cfg: CAMD35 PORT
#
# CS378X - protocolo TCP (cs378x):
#   CS378X USER: user pass [ { OPCOES } ]
#   O servidor (porta) define-se no multics.cfg: CS378X PORT
#
# Opcoes (entre { } separadas por ;):
#   profiles=5501,5502  -> so estes profiles (portas)
#   shares=0:0:0,CAID:PROVID:HOPS -> limites de reshare
#   name="Nome"         -> nome do cliente (aparece na GUI)
#   host=IP             -> so aceita ligacao deste IP/hostname
#   expire=AAAA-MM-DD   -> data de expiracao
#   dcwcheck=YES        -> verificar DCW deste cliente
# ============================================================

# Cliente camd35 simples
CAMD35 USER: userc35 passc35

# Cliente camd35 restrito a um perfil
#CAMD35 USER: userc35b passc35b { profiles=5501 }

# Cliente cs378x simples
CS378X USER: usercsx passcsx

# Cliente cs378x com limites de share
#CS378X USER: usercsxb passcsxb { shares=0:0:0,0500:32830:1; name="Box TCP"; host=192.168.1.80 }
