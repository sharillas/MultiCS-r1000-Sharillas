# ============================================================
# servidores.cfg - TODOS OS TEUS SERVIDORES/READERS
# ============================================================
# AQUI poes TODAS as linhas que TE DAO (a fonte dos cartoes/CWs).
# Cada linha e uma ligacao a outro servidor de partilha:
#
# 1) N-LINE (reader newcamd) - a mais comum:
#    N: IP_OU_HOST PORTA USER PASS 01 02 03 04 05 06 07 08 09 10 11 12 13 14
#    Exemplo:  N: meuservidor.com 34000 meuuser minhapass 01 02 03 04 05 06 07 08 09 10 11 12 13 14
#    (a chave DES de 14 numeros TEM de ser igual a do servidor remoto;
#     os numeros de exemplo 01..14 sao o padrao da maioria)
#
# 2) C-LINE (reader cccam):
#    C: IP_OU_HOST PORTA USER PASS
#    Exemplo:  C: meuservidor.com 12000 meuuser minhapass
#
# 3) L-LINE (reader radegast - raro):
#    L: IP_OU_HOST PORTA USER PASS
#
# 4) CACHE (troca de CWs entre multics/oscam):
#    CACHE: IP_OU_HOST PORTA USER PASS
#    Exemplo:  CACHE: amigo1.com 5599 usercache passcache
#    Opcoes: { csp=yes; nominhits=1; autoadd=yes; sendreq=yes; sendrep=yes }
#
# 5) CACHEEX (troca de CWs "push" - mais rapido):
#    C: IP_OU_HOST PORTA USER PASS { cacheex_mode=3 }
#    Exemplo:  C: amigo2.com 8600 usercx passcx { cacheex_mode=3 }
#
# OPCIONES UTEIS (entre { } separadas por ;):
#    name="Nome"       -> nome do servidor na GUI
#    dcwcheck=YES      -> validar as CWs deste servidor
#    nocheck=yes       -> desligar verificacoes (server com protocolo proprio)
#    shares=CAID:PROVID:HOPS,... -> limites de reshare
#
# NOTA: quem preferir manter tudo no multics.cfg pode copiar estas
# linhas para la e apagar este ficheiro do INCLUDE.
# DEPOIS DE MUDAR: systemctl restart multics (ou Reload na GUI)
# ============================================================

#===================
#       SERVERS NEWCAMD 
#===================
N: 130.255.78.45 3000 sharocas tele 01 02 03 04 05 06 07 08 09 10 11 12 13 14 { nocheck=yes }
N: 130.255.78.45 20333 sharilos testem EF 02 03 04 05 06 07 08 09 10 11 12 13 FA

