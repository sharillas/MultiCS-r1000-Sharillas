# ============================================================
# servidores.cfg - TODOS OS SERVIDORES/READERS (fonte de cards e CWs)
# ============================================================
#
# Este ficheiro junta TODOS os leitores externos:
#
#   1) READERS NEWCAMD  -> linhas N:
#   2) READERS CCCAM    -> linhas C: (dentro da seccao [CCcam] no
#                          multics.cfg ou aqui como linhas soltas)
#   3) READERS RADEGAST -> linhas L:
#   4) PEERS DE CACHE   -> linhas CACHE: host porta user pass
#   5) PEERS CACHEEX    -> linhas C: ... { cacheex_mode=3 }
#   6) SERVIDOR CAMD35  -> CAMD35 USER: (clientes UDP) - ver
#                          clientes_camd35.cfg
#
# NOTA IMPORTANTE: quem preferir manter TUDO no ficheiro mestre
# multics.cfg pode copiar estas linhas para la - o parser le
# qualquer seccao de qualquer ficheiro INCLUDE.
#
# ============================================================
# 1) READERS NEWCAMD (linhas N:)
# ============================================================
# Sintaxe:
#   N: IP_OU_HOST PORTA USER PASS DES_KEY_14_BYTES [ { OPCOES } ]
# A DES_KEY tem de ser IGUAL a do servidor remoto.
#
# Exemplo (comentado - preenche com os teus dados):
#N: servidor.exemplo.com 34000 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14

# Reader com opcoes (nocheck, name):
#N: servidor.exemplo.com 34000 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14 { name="Colega A"; nocheck=yes }

# ============================================================
# 2) READERS CCCAM (linhas C:)
# ============================================================
# Sintaxe:
#   C: IP_OU_HOST PORTA USER PASS [ { OPCOES } ]
#
# Exemplo (comentado):
#C: servidor.exemplo.com 12000 user pass

# Reader CCcam com opcoes:
#C: servidor.exemplo.com 12000 user pass { name="Colega B"; dcwcheck=YES }

# ============================================================
# 3) READERS RADEGAST (linhas L:)
# ============================================================
#   L: IP_OU_HOST PORTA USER PASS [ { OPCOES } ]
# (protocolo radegast - raro hoje em dia)
#L: servidor.exemplo.com 22500 user pass

# ============================================================
# 4) PEERS DE CACHE (CSP) - troca de CWs entre servidores
# ============================================================
# Sintaxe:
#   CACHE: host porta user pass [ { OPCOES } ]
# Opcoes: csp=yes, nominhits=1, autoadd=yes, sendreq=yes,
#         sendrep=yes, fwd=yes, shares=..., profiles=..., caids=...
#
# Exemplo (comentado):
#CACHE: cache1.exemplo.com 5599 user1 pass1
#CACHE: 127.0.0.1 5599 user3 pass3 { shares=0500:32830:1,0100:003311:0; profiles=5501,5502; autoadd=yes; nominhits=1 }

# ============================================================
# 5) PEERS CACHEEX - troca de CWs "push" entre servidores
# ============================================================
# Sintaxe:
#   C: host porta user pass { cacheex_mode=3 }
# Opcoes: cacheex_maxhop=N, dcwcheck=YES, name="..."
#
# Exemplo (comentado):
#C: cachex1.exemplo.com 8600 user1 pass1 { cacheex_mode=3 }
#C: 127.0.0.1 8600 userlocal passlocal { cacheex_mode=3; dcwcheck=YES; name="oscam local" }
