# ============================================================
# Cache.cfg - PEERS DE CACHE (partilha de CWs entre servers)
# Formato: CACHE: host porta user pass { opcoes }
#   Opcoes peer:
#     csp=yes        -> modo protocolo CSP
#     nominhits=1    -> nao desactivar por poucos hits (ex: oscam local)
#     autoadd=yes    -> adicionar peers em runtime automaticamente
#     sendreq=yes    -> enviar pedidos de cache a este peer
#     sendrep=yes    -> aceitar respostas de cache deste peer
#     fwd=yes        -> reencaminhar hits para este peer
#     shares=...     -> limites de partilha (caid:provid:uphops)
#     profiles=...   -> restringir a ports de profiles especificos
# ============================================================

# Peer simples (multiCS/oscam remoto)
CACHE: cache1.exemplo.com 5599 user1 pass1

# Peer com opcoes
CACHE: cache2.exemplo.net 5599 user2 pass2 { csp=yes; sendreq=yes; sendrep=yes; fwd=no; nominhits=1 }

# Peer com limites de share e profiles
CACHE: 192.168.1.50 5599 user3 pass3 { shares=0500:32830:1, 0100:003311:0; profiles=5501,5502; autoadd=yes }
