# ============================================================
# Cache.cfg - PEERS DE CACHE (partilha de CWs entre servidores)
# ============================================================
#
# Peers do protocolo CACHE (MultiCS/oscam remoto). Partilham CWs
# entre instalacoes: o teu server pede CWs a eles e vice-versa.
# O servidor de cache local define-se no multics.cfg (CACHE PORT).
#
# Formato: CACHE: host porta user pass [ { OPCOES } ]
#
# Opcoes peer (entre { } separadas por ;):
#   csp=yes          -> modo protocolo CSP (compat oscam radegast)
#   nominhits=1      -> nunca desactivar por poucos hits
#                       (usar para peers locais/oscam que nao dao hits)
#   autoadd=yes      -> aceitar/registar este peer em runtime
#   sendreq=yes      -> enviar pedidos de cache a este peer
#   sendrep=yes      -> aceitar respostas (CWs) deste peer
#   fwd=yes          -> reencaminhar hits para este peer
#   shares=CAID:PROVID:HOPS,... -> limites de partilha por sistema
#   profiles=5501,5502 -> usar apenas nos profiles indicados
#   caids=0500,0100  -> so partilhar/aceitar estes CAIDs
# ============================================================

# Peer simples (MultiCS ou oscam remoto)
CACHE: cache1.exemplo.com 5599 user1 pass1

# Peer com opcoes completas
#CACHE: cache2.exemplo.net 5599 user2 pass2 { csp=yes; sendreq=yes; sendrep=yes; fwd=no; nominhits=1 }

# Peer local (oscam na mesma maquina) com limites
#CACHE: 127.0.0.1 5599 user3 pass3 { shares=0500:32830:1,0100:003311:0; profiles=5501,5502; autoadd=yes; nominhits=1 }
