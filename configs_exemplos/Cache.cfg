# ============================================================
# Cache.cfg - PEERS DE CACHE (troca de CWs entre servidores)
# ============================================================
#
# O protocolo CACHE (UDP) troca CWs entre instalacoes MultiCS/oscam:
# quando um canal nao esta no teu cache local, perguntas aos peers.
# O servidor de cache local define-se no multics.cfg (CACHE PORT).
#
# Formato: CACHE PEER: host porta [0|1] [ { OPCOES } ]
#   - host/porta = o servidor do amigo (a porta CACHE dele)
#   - 0|1 = fblock0onid (1 = nao enviar pedidos com ONID 0;
#          recomenda-se 0 para comecar e so activar se houver lixo)
#   - opcoes entre { } separadas por ;:
#       autoadd=yes    -> registar este peer em runtime
#       sendreq=yes    -> enviar pedidos de cache a este peer
#       sendrep=yes    -> aceitar respostas (CWs) deste peer
#       fwd=yes        -> reencaminhar hits para este peer
#       csp=yes        -> modo protocolo CSP (compat oscam)
#       shares=CAID:PROVID:HOPS,... -> limites de partilha
#
# O amigo do OUTRO lado mete a tua linha (com o teu IP e a tua
# CACHE PORT, ex. 5599) no multics.cfg dele. O protocolo e UDP:
# abrir a porta no firewall dos dois lados (ufw allow 5599/udp).
#
# Depois de mudar: Reload na GUI (Configuracoes -> Reload Main Config)
# e confirmar na pagina Cache que o peer aparece ONLINE.
# ============================================================

# Exemplo: troca de CWs com o servidor do amigo (cache na porta 5599)
#CACHE PEER: 11.22.33.44 5599 0 { sendreq=yes; sendrep=yes }

# Exemplo: peer oscam (protocolo CSP) que so responde, nunca pede
#CACHE PEER: 22.33.44.55 4500 0 { csp=yes; sendreq=no; sendrep=yes; fwd=no }
