# ============================================================
# blocked_ips.cfg - IPs bloqueados (gerido pela pagina Iptables)
# Um IP por linha. Comentarios com # ou ;
# A GUI (porto HTTP) permite bloquear/desbloquear em runtime.
# O bloqueio cobre TODOS os protocolos (CCcam, Newcamd, Mgcamd,
# Camd35, CS378x, Cache, CacheEX, HTTP de clients e servidores).
# ============================================================

# Exemplos:
# 185.22.10.5
# 91.22.10.7
