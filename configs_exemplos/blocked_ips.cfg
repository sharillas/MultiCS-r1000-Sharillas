# ============================================================
# blocked_ips.cfg - IPS BLOQUEADOS (gerido pela pagina Configs)
# ============================================================
#
# UM IP POR LINHA (formato decimal: a.b.c.d)
# Comentarios com # ou ;
#
# O bloqueio cobre TODOS os protocolos: CCcam, Newcamd, Mgcamd,
# Camd35, CS378x, Cache, CacheEX e HTTP.
#
# Gestao:
#   - Pela GUI (pagina Configs, seccao Blocked IPs): bloqueia e
#     desbloqueia em runtime, mostra pais e tempo de bloqueio.
#   - Manualmente: editar este ficheiro e clicar "Reload Main
#     Config" (ou esperar pela deteccao automatica de mudancas).
#
# Dica: protege contra brute-force de logins - quando um IP tenta
# demasiados logins falhados, pode ser adicionado aqui.
# ============================================================

# Exemplos:
#185.22.10.5
#91.22.10.7
