# ============================================================
# Mgcamd.cfg - UTILIZADORES MGCAMD
# Formato: MG: user pass { opcoes }
#   Opcoes:
#     profiles=5501,5502  -> so estes profiles
#     name="Nome"         -> nome do cliente
#     host=IP             -> IP/hostname permitido
#     expire=AAAA-MM-DD   -> data de expiracao
# ============================================================

# Cliente mgcamd simples
MG: usermg1 passmg1

# Cliente mgcamd restrito a um profile (profiles/shares/dcwcheck suportados)
MG: usermg2 passmg2 { profiles=5501 }
