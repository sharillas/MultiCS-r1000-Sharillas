# ============================================================
# Mgcamd.cfg - UTILIZADORES MGCAMD
# ============================================================
#
# Clientes do protocolo mgcamd (box com mgcamd/oscam).
# O servidor mgcamd e definido no multics.cfg (MGCAMD PORT/KEY).
# A DES KEY tem de ser igual a configurada no cliente (mg_cfg).
#
# Formato: MG: user pass [ { OPCOES } ]
#
# Opcoes (entre { } separadas por ;):
#   profiles=5501,5502  -> so estes profiles (portas)
#   shares=0:0:0,CAID:PROVID:HOPS -> limites de reshare
#   name="Nome"         -> nome do cliente (aparece na GUI)
#   host=IP             -> so aceita ligacao deste IP/hostname
#   expire=AAAA-MM-DD   -> data de expiracao
#   enddate=AAAA-MM-DD  -> o mesmo que expire
#   dcwcheck=YES        -> verificar DCW deste cliente
# ============================================================

# Cliente mgcamd simples (todos os perfis)
MG: usermg1 passmg1

# Cliente restrito a um perfil
#MG: usermg2 passmg2 { profiles=5501 }

# Cliente completo
#MG: usermg3 passmg3 { profiles=5501,5502; name="Box Mgcamd"; host=192.168.1.70; expire=2026-12-31; dcwcheck=YES }
